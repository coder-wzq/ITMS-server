    - GET
    - POST
    - PUT
    - DELETE
  allowedHeaders:
    - Authorization
    - Content-Type
  maxAge: 3600

rateLimit:
  rate: 100
  burst: 200

gateway:
  httpPort: 0
  grpcPort: 0
  timeout: 3000
