# ITMS Nginx Configuration
# Production / Development reverse proxy

upstream gateway_http {
    server gateway:8080;
}

upstream gateway_grpc {
    server gateway:9090;
}

server {
    listen 80;
    server_name itms.local;

    # Gzip compression
    gzip on;
    gzip_min_length 1024;
    gzip_types text/plain application/json application/javascript text/css text/xml application/xml;

    # Client max body size for file uploads
    client_max_body_size 200M;

    # API routes → Gateway (HTTP)
    location /api/ {
        proxy_pass http://gateway_http;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeout settings
        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # WebSocket routes → Gateway (WebSocket Upgrade)
    location /ws/ {
        proxy_pass http://gateway_http;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # Long-lived WebSocket connections
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Static resource service
    location /static/ {
        root /app;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Health check
    location /health {
        proxy_pass http://gateway_http;
        proxy_set_header Host $host;
    }
}

